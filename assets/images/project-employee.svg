<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="emp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9e2d0"/>
      <stop offset="100%" stop-color="#e9e2d0"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c7a3a"/>
      <stop offset="100%" stop-color="#4c7a3a"/>
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5f7030"/>
      <stop offset="100%" stop-color="#4c7a3a"/>
    </linearGradient>
    <filter id="emp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#emp-bg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#2a2f1d" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#e9e2d0" stroke="#4c7a3a"/>
  <circle cx="68" cy="51" r="5" fill="#4c7a3a"/>
  <text x="82" y="56" fill="#4c7a3a" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SPRING BOOT &#x2022; JPA</text>

  <!-- Header Text -->
  <text x="50" y="105" fill="#2a2f1d" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Employee Management System</text>
  <text x="50" y="130" fill="#4c7a3a" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Enterprise RESTful CRUD APIs with Layered Controller-Service-Repository Architecture</text>

  <!-- REST Endpoints Node -->
  <g transform="translate(60, 180)" filter="url(#emp-shadow)">
    <rect width="190" height="170" rx="12" fill="#e9e2d0" stroke="#4c7a3a" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="28" rx="6" fill="#4c7a3a" fill-opacity="0.3"/>
    <text x="95" y="34" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">REST CONTROLLER</text>
    <text x="25" y="75" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Standardized REST APIs</text>
    <text x="25" y="98" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; GET, POST, PUT, DELETE</text>
    <text x="25" y="118" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; DTO Pattern &amp; Validation</text>
    <text x="25" y="138" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; @ControllerAdvice Handling</text>
    <text x="25" y="158" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Standard HTTP Statuses</text>
  </g>

  <!-- Flow Line 1 -->
  <path d="M250 265 L 315 265" stroke="#4c7a3a" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="318,265 310,260 310,270" fill="#4c7a3a"/>

  <!-- Service & JPA Box -->
  <g transform="translate(320, 170)" filter="url(#emp-shadow)">
    <rect width="210" height="185" rx="14" fill="#e9e2d0" stroke="#5f7030" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#4c7a3a" fill-opacity="0.25"/>
    <text x="105" y="35" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SERVICE &amp; JPA LAYER</text>
    <text x="25" y="75" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Spring Data JPA &amp; Hibernate</text>
    <text x="25" y="98" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Business Logic Validation</text>
    <text x="25" y="118" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Declarative @Transactional</text>
    <text x="25" y="138" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Entity Lifecycle Mapping</text>
    <text x="25" y="158" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Clean Repositories</text>
  </g>

  <!-- Flow Line 2 -->
  <path d="M530 265 L 595 265" stroke="#8a5a2b" stroke-width="2.5"/>
  <polygon points="598,265 590,260 590,270" fill="#8a5a2b"/>

  <!-- MySQL Node -->
  <g transform="translate(600, 180)" filter="url(#emp-shadow)">
    <rect width="150" height="170" rx="12" fill="#e9e2d0" stroke="#8a5a2b" stroke-width="1.5"/>
    <rect x="15" y="15" width="120" height="28" rx="6" fill="#8a5a2b" fill-opacity="0.3"/>
    <text x="75" y="34" fill="#8a5a2b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">MYSQL DATABASE</text>
    <text x="18" y="75" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Relational DB</text>
    <text x="18" y="98" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Employees</text>
    <text x="18" y="118" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Departments</text>
    <text x="18" y="138" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Foreign Keys</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(60, 400)">
    <rect width="155" height="55" rx="8" fill="#e9e2d0" stroke="#4c7a3a"/>
    <text x="20" y="24" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">API STANDARD</text>
    <text x="20" y="44" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">RESTful CRUD</text>
  </g>

  <g transform="translate(240, 400)">
    <rect width="155" height="55" rx="8" fill="#e9e2d0" stroke="#4c7a3a"/>
    <text x="20" y="24" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">ARCHITECTURE</text>
    <text x="20" y="44" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Layered 3-Tier</text>
  </g>

  <g transform="translate(420, 400)">
    <rect width="165" height="55" rx="8" fill="#e9e2d0" stroke="#4c7a3a"/>
    <text x="20" y="24" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">PERSISTENCE</text>
    <text x="20" y="44" fill="#8a5a2b" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Hibernate ORM</text>
  </g>

  <g transform="translate(610, 400)">
    <rect width="130" height="55" rx="8" fill="#e9e2d0" stroke="#4c7a3a"/>
    <text x="20" y="24" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="11">VALIDATION</text>
    <text x="20" y="44" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Bean Validation</text>
  </g>
</svg>