<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <filter id="fs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fs-bg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <circle cx="68" cy="51" r="5" fill="#f97316"/>
  <text x="82" y="56" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">REACT + SPRING BOOT</text>

  <!-- Header Text -->
  <text x="50" y="105" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Full-Stack Cloud Infrastructure</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Unified Deployment: Cloudflare Pages Edge + Render Docker Services</text>

  <!-- React Frontend Node -->
  <g transform="translate(60, 180)" filter="url(#fs-shadow)">
    <rect width="200" height="170" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="15" y="15" width="170" height="30" rx="6" fill="#0891b2" fill-opacity="0.25"/>
    <text x="100" y="35" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">REACT FRONTEND</text>
    <text x="25" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Cloudflare Pages (Edge)</text>
    <text x="25" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Vite SPA + Tailwind CSS</text>
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Global Edge CDN Caching</text>
    <text x="25" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; JWT Auth &amp; State Management</text>
    <text x="25" y="158" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Sub-50ms TTFB</text>
  </g>

  <!-- Arrow -->
  <path d="M260 265 L 325 265" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="328,265 320,260 320,270" fill="#f97316"/>
  <text x="293" y="255" fill="#f97316" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">HTTPS</text>

  <!-- Spring Boot Backend Node -->
  <g transform="translate(330, 165)" filter="url(#fs-shadow)">
    <rect width="210" height="190" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#059669" fill-opacity="0.25"/>
    <text x="105" y="35" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SPRING BOOT BACKEND</text>
    <text x="25" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Render Docker Container</text>
    <text x="25" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; RESTful API &amp; WebSockets</text>
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Spring Security + JWT</text>
    <text x="25" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; HikariCP Connection Pool</text>
    <text x="25" y="158" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Actuator Health Checks</text>
    <text x="25" y="178" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Auto Zero-Downtime Deploy</text>
  </g>

  <!-- Arrow -->
  <path d="M540 265 L 595 265" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="598,265 590,260 590,270" fill="#38bdf8"/>

  <!-- Database Node -->
  <g transform="translate(600, 180)" filter="url(#fs-shadow)">
    <rect width="150" height="170" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="15" width="126" height="30" rx="6" fill="#0284c7" fill-opacity="0.25"/>
    <text x="75" y="35" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DATA LAYER</text>
    <text x="18" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Postgres + Redis</text>
    <text x="18" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Managed PG</text>
    <text x="18" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Redis Cache</text>
    <text x="18" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Auto Backups</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">FRONTEND HOST</text>
    <text x="20" y="44" fill="#f97316" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Cloudflare Pages</text>
  </g>

  <g transform="translate(240, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">BACKEND HOST</text>
    <text x="20" y="44" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Render Docker</text>
  </g>

  <g transform="translate(420, 400)">
    <rect width="165" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">CI/CD PIPELINE</text>
    <text x="20" y="44" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">GitHub Actions</text>
  </g>

  <g transform="translate(610, 400)">
    <rect width="130" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">SECURITY</text>
    <text x="20" y="44" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">JWT + CORS</text>
  </g>
</svg>