<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <filter id="bm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bm-bg)"/>

  <!-- Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <circle cx="68" cy="51" r="5" fill="#ec4899"/>
  <text x="82" y="56" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">JMH BENCHMARKS &amp; LOOM</text>

  <!-- Header Text -->
  <text x="50" y="105" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">High-Concurrency Benchmark Suite</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Virtual Threads vs. Platform Thread Pool + JMH Rate Limiter Hot Path</text>

  <!-- Comparison Box -->
  <g transform="translate(60, 175)" filter="url(#bm-shadow)">
    <rect width="680" height="190" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Left side: Platform Threads -->
    <g transform="translate(30, 25)">
      <text x="0" y="20" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Platform Fixed Thread Pool (200 threads)</text>
      <!-- Bar -->
      <rect x="0" y="35" width="260" height="24" rx="6" fill="#334155"/>
      <rect x="0" y="35" width="110" height="24" rx="6" fill="#f43f5e"/>
      <text x="120" y="52" fill="#fda4af" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">3,200 req/sec (Context switch bottleneck)</text>
      <text x="0" y="85" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Memory footprint: ~1MB per thread stack</text>
      <text x="0" y="105" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; OS thread starvation under 10k blocking calls</text>
    </g>

    <!-- Divider -->
    <line x1="340" y1="20" x2="340" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Right side: Java 21 Virtual Threads -->
    <g transform="translate(370, 25)">
      <text x="0" y="20" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Java 21 Virtual Threads (Loom)</text>
      <!-- Bar -->
      <rect x="0" y="35" width="260" height="24" rx="6" fill="#334155"/>
      <rect x="0" y="35" width="245" height="24" rx="6" fill="#10b981"/>
      <text x="175" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">48,500 req/sec</text>
      <text x="0" y="85" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Memory footprint: ~few hundred bytes</text>
      <text x="0" y="105" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; 15x throughput increase with zero OS thread saturation</text>
      <text x="0" y="125" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Tested under Gatling &amp; k6 load harness</text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(60, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">THROUGHPUT GAIN</text>
    <text x="20" y="44" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">+1,400%</text>
  </g>

  <g transform="translate(240, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">HARNESS</text>
    <text x="20" y="44" fill="#ec4899" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">OpenJDK JMH</text>
  </g>

  <g transform="translate(420, 400)">
    <rect width="165" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">LOAD TESTING</text>
    <text x="20" y="44" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Gatling &amp; k6</text>
  </g>

  <g transform="translate(610, 400)">
    <rect width="130" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">INTEGRATION</text>
    <text x="20" y="44" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Testcontainers</text>
  </g>
</svg>