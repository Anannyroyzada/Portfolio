<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="fl-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#fl-bg)"/>
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#312e81" stroke="#4338ca"/>
  <circle cx="68" cy="51" r="5" fill="#818cf8"/>
  <text x="82" y="56" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">JAVA &bull; SERVLETS &bull; JDBC</text>
  <text x="50" y="105" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700">Flight Management System</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">Enterprise Booking Engine with JDBC Transaction Management</text>

  <!-- Flow Boxes -->
  <g transform="translate(60, 180)" filter="url(#fl-sh)">
    <rect width="200" height="170" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="25" y="35" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Client / Web Layer</text>
    <text x="25" y="70" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Flight Search &amp; Filter</text>
    <text x="25" y="95" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Passenger Booking Form</text>
    <text x="25" y="120" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Admin Console View</text>
    <text x="25" y="145" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; Session Management</text>
  </g>
  <path d="M260 265 L 315 265" stroke="#818cf8" stroke-width="2.5"/>
  <polygon points="318,265 310,260 310,270" fill="#818cf8"/>
  <g transform="translate(320, 180)" filter="url(#fl-sh)">
    <rect width="220" height="170" rx="12" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="35" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Java Servlets &amp; JDBC</text>
    <text x="25" y="70" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Request Dispatching</text>
    <text x="25" y="95" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Business Validation</text>
    <text x="25" y="120" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Direct JDBC Queries</text>
    <text x="25" y="145" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; Transaction Rollback Safe</text>
  </g>
  <path d="M540 265 L 595 265" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="598,265 590,260 590,270" fill="#38bdf8"/>
  <g transform="translate(600, 180)" filter="url(#fl-sh)">
    <rect width="140" height="170" rx="12" fill="#1e1b4b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="35" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">MySQL DB</text>
    <text x="20" y="70" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Flights Schema</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Bookings</text>
    <text x="20" y="120" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; User Auth</text>
    <text x="20" y="145" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; Foreign Keys</text>
  </g>
</svg>