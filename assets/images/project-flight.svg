<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="indigo-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sky-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="fl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fl-bg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
  <circle cx="68" cy="51" r="5" fill="#818cf8"/>
  <text x="82" y="56" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">JAVA &#x2022; SERVLETS &#x2022; JDBC</text>

  <!-- Header Text -->
  <text x="50" y="105" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Flight Management System</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14">Transactional Booking Engine with Low-Level JDBC Persistence &amp; Servlets</text>

  <!-- Client Traffic Node -->
  <g transform="translate(60, 180)" filter="url(#fl-shadow)">
    <rect width="190" height="170" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="160" height="28" rx="6" fill="#4338ca" fill-opacity="0.25"/>
    <text x="95" y="34" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">WEB / PRESENTATION</text>
    <text x="25" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Dynamic JSP &amp; HTML5</text>
    <text x="25" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Flight Search &amp; Filtering</text>
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Seat Reservation Workflow</text>
    <text x="25" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Admin Console View</text>
    <text x="25" y="158" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Stateful Sessions</text>
  </g>

  <!-- Flow Line 1 -->
  <path d="M250 265 L 315 265" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="318,265 310,260 310,270" fill="#818cf8"/>

  <!-- Servlets Engine Box -->
  <g transform="translate(320, 170)" filter="url(#fl-shadow)">
    <rect width="210" height="185" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#0284c7" fill-opacity="0.25"/>
    <text x="105" y="35" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">JAVA SERVLETS &amp; JDBC</text>
    <text x="25" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Business Routing Layer</text>
    <text x="25" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; HttpServlet Request Dispatch</text>
    <text x="25" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Prepared Statements Pool</text>
    <text x="25" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Transaction Rollback Safe</text>
    <text x="25" y="158" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&#x2713; Zero SQL Injection</text>
  </g>

  <!-- Flow Line 2 -->
  <path d="M530 265 L 595 265" stroke="#34d399" stroke-width="2.5"/>
  <polygon points="598,265 590,260 590,270" fill="#34d399"/>

  <!-- MySQL DB Node -->
  <g transform="translate(600, 180)" filter="url(#fl-shadow)">
    <rect width="150" height="170" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="15" y="15" width="120" height="28" rx="6" fill="#059669" fill-opacity="0.25"/>
    <text x="75" y="34" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">MYSQL DATABASE</text>
    <text x="18" y="75" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ACID Relational</text>
    <text x="18" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Flight Schemas</text>
    <text x="18" y="118" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Booking Records</text>
    <text x="18" y="138" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">&#x2022; Foreign Keys</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(60, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">TRANSACTIONS</text>
    <text x="20" y="44" fill="#818cf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">ACID Safe</text>
  </g>

  <g transform="translate(240, 400)">
    <rect width="155" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">DATA ACCESS</text>
    <text x="20" y="44" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Direct JDBC</text>
  </g>

  <g transform="translate(420, 400)">
    <rect width="165" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">PERSISTENCE</text>
    <text x="20" y="44" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">MySQL Engine</text>
  </g>

  <g transform="translate(610, 400)">
    <rect width="130" height="55" rx="8" fill="#161e2e" stroke="#253248"/>
    <text x="20" y="24" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">SECURITY</text>
    <text x="20" y="44" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Prepared SQL</text>
  </g>
</svg>