<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ppt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3eedd"/>
      <stop offset="100%" stop-color="#f3eedd"/>
    </linearGradient>
    <filter id="ppt-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#ppt-bg)"/>
  <g opacity="0.07" stroke="#2a2f1d" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <rect x="50" y="35" width="220" height="32" rx="16" fill="#f6f1e1" stroke="#e9e2d0"/>
  <circle cx="68" cy="51" r="5" fill="#5f7030"/>
  <text x="82" y="56" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">REACT + SPRING BOOT</text>
  <text x="50" y="105" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="700">Personal Productivity Tracker</text>
  <text x="50" y="130" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="14">Full-Stack Task Management with Layered Architecture &amp; JWT Security</text>

  <!-- Flow Boxes -->
  <g transform="translate(60, 180)" filter="url(#ppt-sh)">
    <rect width="200" height="170" rx="12" fill="#f6f1e1" stroke="#5f7030" stroke-width="1.5"/>
    <text x="25" y="35" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">React Frontend</text>
    <text x="25" y="70" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Component State Mgmt</text>
    <text x="25" y="95" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Responsive UI / UX</text>
    <text x="25" y="120" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Axios REST Client</text>
    <text x="25" y="145" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; JWT Token Handling</text>
  </g>

  <path d="M260 265 L 315 265" stroke="#5f7030" stroke-width="2.5"/>
  <polygon points="318,265 310,260 310,270" fill="#5f7030"/>

  <g transform="translate(320, 180)" filter="url(#ppt-sh)">
    <rect width="220" height="170" rx="12" fill="#f6f1e1" stroke="#4c7a3a" stroke-width="1.5"/>
    <text x="25" y="35" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Spring Boot REST API</text>
    <text x="25" y="70" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Controller - Service - Repo</text>
    <text x="25" y="95" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Spring Security + JWT</text>
    <text x="25" y="120" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Request Validation</text>
    <text x="25" y="145" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; User-Specific Data Isolation</text>
  </g>

  <path d="M540 265 L 595 265" stroke="#4c7a3a" stroke-width="2.5"/>
  <polygon points="598,265 590,260 590,270" fill="#4c7a3a"/>

  <g transform="translate(600, 180)" filter="url(#ppt-sh)">
    <rect width="140" height="170" rx="12" fill="#f6f1e1" stroke="#8a5a2b" stroke-width="1.5"/>
    <text x="20" y="35" fill="#8a5a2b" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">MySQL DB</text>
    <text x="20" y="70" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Hibernate</text>
    <text x="20" y="95" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; Spring Data JPA</text>
    <text x="20" y="120" fill="#2a2f1d" font-family="'Segoe UI', sans-serif" font-size="12">&#x2022; ACID Trans</text>
    <text x="20" y="145" fill="#8a5a2b" font-family="'Segoe UI', sans-serif" font-size="12">&#x2713; Indexed Keys</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(60, 400)">
    <rect width="155" height="55" rx="8" fill="#ece6d4" stroke="#d8d1bd"/>
    <text x="20" y="24" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="11">SECURITY</text>
    <text x="20" y="44" fill="#5f7030" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">JWT Stateless</text>
  </g>
  <g transform="translate(240, 400)">
    <rect width="155" height="55" rx="8" fill="#ece6d4" stroke="#d8d1bd"/>
    <text x="20" y="24" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="11">ARCHITECTURE</text>
    <text x="20" y="44" fill="#4c7a3a" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">3-Tier Layered</text>
  </g>
  <g transform="translate(420, 400)">
    <rect width="165" height="55" rx="8" fill="#ece6d4" stroke="#d8d1bd"/>
    <text x="20" y="24" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="11">PERSISTENCE</text>
    <text x="20" y="44" fill="#8a5a2b" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">Spring Data JPA</text>
  </g>
  <g transform="translate(610, 400)">
    <rect width="130" height="55" rx="8" fill="#ece6d4" stroke="#d8d1bd"/>
    <text x="20" y="24" fill="#555a44" font-family="'Segoe UI', sans-serif" font-size="11">FRONTEND</text>
    <text x="20" y="44" fill="#7d5f34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">React SPA</text>
  </g>
</svg>